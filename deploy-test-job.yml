# DRAFT — ตัวอย่าง job "deploy-test" ที่ยังไม่ได้เอาไปใช้จริง
# เป้าหมาย: เติม gap ที่พบว่า merge เข้า `staging` ตอนนี้ "ผ่านแค่ check" ไม่มี deploy เข้า staging workspace จริง
#
# วิธีใช้: เอา 2 ส่วนด้านล่างไปรวมเข้ากับ .github/workflows/fabric-ci.yml ของ dataops-fabric-pilot จริง
#   1. แก้ on.push.branches ให้มี 'staging' เพิ่ม (ไม่งั้น job นี้จะไม่ trigger เลยแบบเงียบๆ
#      เหมือนบั๊กที่เจอกับ 'main' มาก่อนหน้านี้)
#   2. เพิ่ม job deploy-test เข้าไปในไฟล์เดิม (วางต่อจาก job "deploy-prod" ก็ได้)
#
# ต้องใส่ STAGING_WORKSPACE_ID ให้เป็น GUID จริงของ staging workspace ก่อน — ตอนนี้ยังไม่มี
# workspace staging แยกต่างหาก (มีแค่ dev = 7a829f6b-... กับ production = 84cc9682-...)
# ต้องสร้าง workspace ใหม่สำหรับ staging ก่อนถึงจะใช้ job นี้ได้จริง

# ===== ส่วนที่ 1: แก้ on.push.branches (บรรทัดเดิมอยู่บนสุดของไฟล์) =====
#
# เดิม:
#   on:
#     push:
#       branches: [ 'dev', 'main', 'feature/**' ]
#     pull_request:
#       branches: [ 'staging', 'main' ]
#
# แก้เป็น (เพิ่ม 'staging' เข้า push):
#   on:
#     push:
#       branches: [ 'dev', 'staging', 'main', 'feature/**' ]
#     pull_request:
#       branches: [ 'staging', 'main' ]


# ===== ส่วนที่ 2: job ใหม่ที่ต้องเพิ่ม =====

  deploy-test:
    needs: test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # ไม่ต้องผูก environment/required-reviewer เหมือน deploy-prod
    # เพราะ staging เป็นพื้นที่ทดสอบร่วมกัน ไม่ใช่ของจริงที่กระทบผู้ใช้งานปลายทาง
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Deploy to Fabric (staging)
        run: python scripts/deploy.py --workspace <STAGING_WORKSPACE_ID> --environment staging
        env:
          FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}

# หมายเหตุ: ค่า --environment ที่ใส่ตรงนี้ ("staging") ต้องตรงกับ environment key
# ที่ใช้ใน parameter.yml เป๊ะ (ดู draft-parameter.yml ที่เก็บไว้คู่กันในโฟลเดอร์นี้)
# ถ้าตั้งชื่อไม่ตรงกัน fabric-cicd จะข้าม replacement rule นั้นไปเงียบๆ ไม่ error ให้เห็น
