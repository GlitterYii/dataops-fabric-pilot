# fabric-cicd parameter file — remap environment-specific GUIDs ที่ฝังอยู่ในไฟล์ item ตอน deploy
# อ้างอิง: https://microsoft.github.io/fabric-cicd/latest/config_files/parameter/
#
# ปัญหาที่แก้: Notebook ที่ attach Lakehouse ผ่าน Fabric UI จะฝัง lakehouse id + workspace id
# ของ environment ที่สร้างตอนนั้น (เช่น Dev) ไว้ใน METADATA ของตัวเอง
# ถ้าไม่ remap ตอน deploy ข้าม environment มันจะยังชี้กลับไปที่ lakehouse ของ Dev อยู่
# (รันผ่านไม่ error แต่ table ไปโผล่ผิดที่ หรือหาตารางใน environment ปลายทางไม่เจอ)
#
# วิธีแก้: ใช้ $items.<type>.<name>.$id ให้ fabric-cicd หา Lakehouse ชื่อเดียวกัน
# ใน target workspace ของ environment ที่กำลัง deploy อยู่ ณ ตอนนั้นเอง — ไม่ต้อง hardcode
# GUID ของ staging/prod ล่วงหน้า
#
# replace_value ต้องเป็น dictionary เสมอ (fabric-cicd บังคับ) — ใช้ key พิเศษ "_ALL_"
# เพื่อให้ apply กับทุก environment เหมือนกันหมด (ต้องเป็น key เดียวในนั้นเท่านั้น
# ถ้ามี env key อื่นปนอยู่ด้วย fabric-cicd จะ validation fail)

find_replace:
  # default_lakehouse + known_lakehouses.id (lakehouse artifact id ของ Dev)
  - find_value: "a7654c8c-f870-4bb7-8a88-fe3866b9c2a9"
    replace_value:
      _ALL_: "$items.Lakehouse.lh_test_lakehouse.$id"
    item_type: "Notebook"

  # default_lakehouse_workspace_id (workspace id ของ Dev)
  - find_value: "7a829f6b-4fd1-45c7-8c8e-b7c317816e4b"
    replace_value:
      _ALL_: "$workspace.$id"
    item_type: "Notebook"

# --- เพิ่มโดย generate_parameter.py ---
  - find_value: 66b9c2a9-fe38-8a88-4bb7-f870a7654c8c
    replace_value:
      _ALL_: $items.Lakehouse.lh_test_lakehouse.$id
    item_type: DataPipeline

# --- pl_test_warehouse_sink (Track A: Copy Data -> Fabric Warehouse native sink test) ---
  # (workspace id ของ Dev ไม่ต้อง remap สำหรับ pipeline นี้ — sink อยู่ workspace เดียวกับ
  # pipeline เอง Fabric เลยเก็บ workspaceId เป็น 00000000... placeholder ใน pipeline-content.json
  # ไม่ใช่ GUID จริง — เช็คแล้วว่า 7a829f6b-... ไม่ปรากฏใน DataPipeline ไฟล์ไหนเลย)

  # warehouse artifact id ของ wh_test_warehouse (Dev) — เก็บใน pipeline-content.json
  # เป็น GUID แบบ byte-swapped (คนละ representation จาก canonical form ที่เห็นใน URL/Workspace
  # settings) เจอ pattern เดียวกับที่ทีมเคยเจอมาก่อนกับ Lakehouse (ดู entry ด้านบนของ
  # 66b9c2a9-fe38-8a88-4bb7-f870a7654c8c ที่แท้จริงคือ a7654c8c-f870-4bb7-8a88-fe3866b9c2a9
  # แบบ swap เดียวกัน) — canonical form คือ 5924efa0-649c-4203-812f-13f787c77113
  - find_value: "87c77113-13f7-812f-4203-649c5924efa0"
    replace_value:
      _ALL_: "$items.Warehouse.wh_test_warehouse.$id"
    item_type: "DataPipeline"